        link: { type: port, value: 8080 }

      - name: CouchDB
        icon: local:couchdb
        embed: true
        link: { type: port, value: 5984, path: /_utils/ }

  - name: Home
    icon: local:home
    items:
      - name: Home Assistant
        icon: local:home-assistant
        embed: false
        dashboard: 5
        link: { type: port, value: 8123 }

