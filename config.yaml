        icon: local:syncthing
        embed: true
        link: { type: path, value: /syncthing/ }

      - name: File Browser
        icon: local:filebrowser
        embed: true
        link: { type: path, value: /fb/ }

      - name: WebDAV Manager
        icon: local:folder-network
