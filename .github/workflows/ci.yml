name: CI

# Renovate merges its own PRs once this passes - it is required by the
# main-branch ruleset.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: app.js parses
        run: node --check js/app.js
      - name: config.yaml parses
        run: python3 -c "import yaml; yaml.safe_load(open('config.yaml'))"
